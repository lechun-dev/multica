name: Deploy Multica Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Stable or beta tag, for example v0.4.86-beta.1
        required: true
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: Stable or beta tag, for example v0.4.86-beta.1
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_path: /deploy/multica-staging
      compose_project: multica-staging
      image_tag: ${{ inputs.image_tag }}
      environment_name: staging
    secrets: inherit
