name: Deploy Multica Staging

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_path: /deploy/multica-staging
      compose_project: multica-staging
      # 2026-09-15 coder(lq): The selected workflow tag is also the immutable
      # image tag, so operators choose the release version only once.
      image_tag: ${{ github.ref_name }}
      environment_name: staging
      require_tag_ref: true
    secrets: inherit
