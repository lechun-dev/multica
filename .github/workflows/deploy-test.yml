name: Deploy Multica Test

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Stable, beta, or test tag, for example v0.4.86-test.1
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_path: /deploy/multica-test
      compose_project: multica-test
      image_tag: ${{ inputs.image_tag }}
      environment_name: test
    secrets: inherit
