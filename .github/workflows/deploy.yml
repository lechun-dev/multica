name: Deploy Multica

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /deploy/multica
            # 2026-08-26 coder(lq): Deploy published GHCR images without making
            # the server fetch GitHub source over its unreliable HTTPS route.
            docker compose -f docker-compose.selfhost.yml -f docker-compose.selfhost.override.yml pull backend frontend
            docker compose -f docker-compose.selfhost.yml -f docker-compose.selfhost.override.yml up -d --no-build backend frontend
            docker image prune -f
