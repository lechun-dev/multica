name: Deploy Multica

on:
  workflow_call:
    inputs:
      deploy_path:
        description: Target directory on the deploy host
        required: false
        type: string
        default: /deploy/multica
      compose_project:
        description: Docker Compose project name
        required: false
        type: string
        default: multica
      image_tag:
        description: Optional image tag to deploy
        required: false
        type: string
        default: ""
      environment_name:
        description: GitHub environment name
        required: false
        type: string
        default: production
  workflow_dispatch:
    inputs:
      deploy_path:
        description: Target directory on the deploy host
        required: false
        type: string
        default: /deploy/multica
      compose_project:
        description: Docker Compose project name
        required: false
        type: string
        default: multica
      image_tag:
        description: Optional image tag to deploy
        required: false
        type: string
        default: ""
      environment_name:
        description: GitHub environment name
        required: false
        type: string
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name || 'production' }}
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # 2026-09-04 coder(lq): Make deploy failures explicit by checking compose
            # file availability before pull, and support hosts where override compose file
            # is intentionally absent.
            set -euo pipefail
            cd "${{ inputs.deploy_path || '/deploy/multica' }}"
            image_tag="${{ inputs.image_tag || '' }}"
            compose_project="${{ inputs.compose_project || 'multica' }}"
            compose_base_file="docker-compose.selfhost.yml"
            compose_override_file="docker-compose.selfhost.override.yml"
            if [ -n "$image_tag" ]; then
              export MULTICA_IMAGE_TAG="$image_tag"
            fi

            if [ ! -f "$compose_base_file" ]; then
              echo "Error: missing required $compose_base_file in $PWD"
              ls -la
              exit 1
            fi

            compose_files="-f $compose_base_file"
            if [ -f "$compose_override_file" ]; then
              compose_files="$compose_files -f $compose_override_file"
            else
              echo "Warning: optional override file $compose_override_file not found, deploying with base compose file."
            fi

            # 2026-09-02 coder(lq): Keep the compose sequence identical between
            # staging and production. Only the target directory and compose
            # project name vary, so both environments reuse the same image pull
            # and recreate flow.
            docker compose -p "$compose_project" $compose_files pull backend frontend
            docker compose -p "$compose_project" $compose_files up -d --no-build backend frontend
            docker image prune -f
