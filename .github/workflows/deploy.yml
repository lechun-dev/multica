name: Deploy Multica

on:
  workflow_call:
    inputs:
      deploy_path:
        description: Target directory on the deploy host
        required: false
        type: string
        default: /deploy/multica
      compose_project:
        description: Docker Compose project name
        required: false
        type: string
        default: multica
      image_tag:
        description: Immutable release image tag to deploy
        required: true
        type: string
      require_tag_ref:
        description: Require the workflow to be dispatched from a tag
        required: false
        type: boolean
        default: false
      environment_name:
        description: GitHub environment name
        required: false
        type: string
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 2026-10-20 coder(lq): Serialize deployments of one environment; never cancel a live rollout.
    concurrency:
      group: deploy-${{ inputs.compose_project || 'multica' }}-${{ inputs.environment_name || 'production' }}
      cancel-in-progress: false
    environment: ${{ inputs.environment_name || 'production' }}
    steps:
      - name: Check out deployment policy
        uses: actions/checkout@v5

      # 2026-09-15 coder(lq): Enforce the channel matrix in the reusable
      # workflow so direct dispatches and wrapper workflows share one guard.
      - name: Validate deployment tag
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name || 'production' }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REQUIRE_TAG_REF: ${{ inputs.require_tag_ref }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          # 2026-09-15 coder(lq): Named manual deployments derive the image
          # version from the selected ref and must never accept a branch.
          if [[ "$REQUIRE_TAG_REF" == "true" && "$SOURCE_REF_TYPE" != "tag" ]]; then
            echo "::error::Select a release tag in 'Use workflow from'; branches cannot be deployed."
            exit 1
          fi
          node scripts/validate-deploy-tag.mjs "$DEPLOY_ENVIRONMENT" "$IMAGE_TAG"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 2026-09-17 coder(lq): Image pulls on the test host can exceed the
          # action's 10-minute default when registry throughput is low.
          command_timeout: 30m
          script: |
            set -eu
            cd "${{ inputs.deploy_path || '/deploy/multica' }}"
            image_tag="${{ inputs.image_tag }}"
            export MULTICA_IMAGE_TAG="$image_tag"
            # 2026-09-17 coder(lq): Test acceptance needs task ACL writes
            # enabled; production can still set or roll back this phase from
            # its own .env without changing the deployment workflow.
            if [ "${{ inputs.environment_name || 'production' }}" = "test" ] && [ -z "${PROJECT_PERMISSION_ROLLOUT_PHASE:-}" ]; then
              export PROJECT_PERMISSION_ROLLOUT_PHASE=writer
            fi
            cat > /tmp/multica-project-permission-rollout.yml <<'YAML'
            services:
              backend:
                environment:
                  PROJECT_PERMISSION_ROLLOUT_PHASE: ${PROJECT_PERMISSION_ROLLOUT_PHASE:-}
                  # 2026-09-18 coder(lq): The deployment host keeps its own
                  # compose files, so forward this policy in the generated
                  # override to ensure the host .env value reaches the backend.
                  PROJECT_OWNER_BYPASS_ENABLED: ${PROJECT_OWNER_BYPASS_ENABLED:-true}
            YAML
            # 2026-09-23 coder(lq): Every compose call carries the generated
            # override, so image pull, migration and startup all agree on the
            # permission policy.
            compose() {
              docker compose -p "${{ inputs.compose_project || 'multica' }}" -f docker-compose.selfhost.yml -f docker-compose.selfhost.override.yml -f /tmp/multica-project-permission-rollout.yml "$@"
            }
            # 2026-09-02 coder(lq): Keep the compose sequence identical between
            # staging and production. Only the target directory and compose
            # project name vary, so both environments reuse the same image pull
            # and recreate flow.
            compose pull backend frontend

            # 2026-09-23 coder(lq): Run migrations explicitly before replacing
            # the application. Remote overrides may replace the image entrypoint,
            # so relying on backend startup can leave the database schema stale.
            compose run --rm --no-deps --entrypoint ./migrate backend up
            compose up -d --no-build backend frontend

            # 2026-09-23 coder(lq): A detached compose start only confirms that
            # containers were created. Require the backend readiness endpoint so
            # missing migrations and crash loops fail the deployment visibly.
            backend_container="$(compose ps -q backend)"
            if [ -z "$backend_container" ]; then
              echo "Backend container was not created."
              compose logs --no-color --tail=200 backend
              exit 1
            fi

            ready=false
            attempt=1
            while [ "$attempt" -le 36 ]; do
              running="$(docker inspect -f '{{.State.Running}}' "$backend_container" 2>/dev/null || true)"
              if [ "$running" != "true" ]; then
                echo "Backend container stopped before becoming ready."
                compose logs --no-color --tail=200 backend
                exit 1
              fi
              if compose exec -T backend wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 5
              attempt=$((attempt + 1))
            done

            if [ "$ready" != "true" ]; then
              echo "Backend did not become ready within 180 seconds."
              compose exec -T backend wget -O- http://127.0.0.1:8080/readyz || true
              compose logs --no-color --tail=200 backend
              exit 1
            fi


            # 2026-09-18 coder(lq): Verify the policy inside the recreated
            # backend container; checking only the host .env misses compose
            # forwarding mistakes and stale containers.
            expected_owner_bypass="${PROJECT_OWNER_BYPASS_ENABLED:-}"
            if [ -z "$expected_owner_bypass" ] && [ -f .env ]; then
              expected_owner_bypass="$(sed -n 's/^[[:space:]]*PROJECT_OWNER_BYPASS_ENABLED[[:space:]]*=[[:space:]]*//p' .env | tail -n 1 | tr -d '\r' | xargs)"
            fi
            expected_owner_bypass="${expected_owner_bypass:-true}"
            actual_owner_bypass="$(compose exec -T backend sh -c 'printf %s "$PROJECT_OWNER_BYPASS_ENABLED"')"
            if [ "$actual_owner_bypass" != "$expected_owner_bypass" ]; then
              echo "PROJECT_OWNER_BYPASS_ENABLED mismatch: expected '$expected_owner_bypass', backend received '$actual_owner_bypass'" >&2
              exit 1
            fi
            # 2026-10-20 coder(lq): Health alone does not prove the selected release is running.
            # Compare both the configured reference and immutable image ID before recording success.
            for service in backend frontend; do
              container="$(compose ps -q "$service")"
              actual_image="$(docker inspect -f '{{.Config.Image}}' "$container")"
              if [ "${actual_image##*:}" != "$image_tag" ]; then
                echo "$service image tag mismatch: expected $image_tag, received $actual_image" >&2
                exit 1
              fi
              expected_id="$(docker image inspect -f '{{.Id}}' "$actual_image")"
              actual_id="$(docker inspect -f '{{.Image}}' "$container")"
              if [ "$actual_id" != "$expected_id" ]; then
                echo "$service is running a stale image ID." >&2
                exit 1
              fi
            done

            # 2026-10-20 coder(lq): Persist only a verified release so later Compose maintenance
            # cannot silently recreate containers with the old .env tag. Never print/copy secrets.
            # BEGIN PERSIST_VERIFIED_DEPLOY_TAG
            [ -f .env ] && [ ! -L .env ]
            env_tmp="$(mktemp .env.deploy.XXXXXX)"
            trap 'rm -f "$env_tmp"' EXIT HUP INT TERM
            env_mode="$(stat -c '%a' .env 2>/dev/null || stat -f '%Lp' .env)"
            chmod "$env_mode" "$env_tmp"
            awk -v tag="$image_tag" '
              /^[[:space:]]*(export[[:space:]]+)?MULTICA_IMAGE_TAG[[:space:]]*=/ {
                if (!written) print "MULTICA_IMAGE_TAG=" tag
                written=1
                next
              }
              { print }
              END { if (!written) print "MULTICA_IMAGE_TAG=" tag }
            ' .env > "$env_tmp"
            mv -f "$env_tmp" .env
            trap - EXIT HUP INT TERM
            # END PERSIST_VERIFIED_DEPLOY_TAG

            # 2026-10-20 coder(lq): With the temporary export removed, maintenance must still
            # resolve both services to the just-verified images from the saved configuration.
            unset MULTICA_IMAGE_TAG
            for image in $(compose config --images); do
              case "$image" in
                *multica-backend:*|*multica-web:*)
                  if [ "${image##*:}" != "$image_tag" ]; then
                    echo "Saved deployment image tag does not match $image_tag." >&2
                    exit 1
                  fi
                  ;;
              esac
            done
            echo "Verified and saved deployment image tag: $image_tag"
            docker image prune -f
