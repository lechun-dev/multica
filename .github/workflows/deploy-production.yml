name: Deploy Multica Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag to deploy to production
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      image_tag:
        description: Optional image tag to deploy to production
        required: false
        type: string
        default: ""

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_path: /deploy/multica
      compose_project: multica
      image_tag: ${{ inputs.image_tag || '' }}
      environment_name: production
    secrets: inherit
