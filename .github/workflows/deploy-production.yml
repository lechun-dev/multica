name: Deploy Multica Production

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_path: /deploy/multica
      compose_project: multica
      # 2026-09-15 coder(lq): The selected workflow tag is also the immutable
      # image tag, so operators choose the release version only once.
      image_tag: ${{ github.ref_name }}
      environment_name: production
      require_tag_ref: true
    secrets: inherit
