name: Deploy Multica Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Stable tag only, for example v0.4.86
        required: true
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: Stable tag only, for example v0.4.86
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_path: /deploy/multica
      compose_project: multica
      image_tag: ${{ inputs.image_tag }}
      environment_name: production
    secrets: inherit
