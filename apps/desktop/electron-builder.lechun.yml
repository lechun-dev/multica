# Lechun's distributable desktop build. Keep the upstream configuration as
# the base so future Multica updates remain easy to merge; this file contains
# only values that must differ from the official application.
extends: electron-builder.yml

appId: ai.multica.desktop.lechun
productName: Multica Lechun

extraMetadata:
  productName: Multica Lechun
  multicaDesktopVariant: lechun

# Keep direct electron-builder invocations on the Lechun feed as well. The
# package script adds architecture-specific suffixes where required.
publish:
  channel: latest-lechun

protocols:
  - name: Multica Lechun
    schemes:
      - multica-lechun

mac:
  artifactName: multica-lechun-${version}-mac-${arch}.${ext}

linux:
  # Linux package managers require a machine-safe package name. Keep this
  # separate from productName so the installed app still displays "Multica
  # Lechun" while RPM/deb metadata uses a valid identifier without spaces.
  packageName: multica-lechun
  artifactName: multica-lechun-${version}-linux-${arch}.${ext}
  executableName: multica-lechun
  desktop:
    entry:
      StartupWMClass: Multica Lechun

win:
  artifactName: multica-lechun-${version}-windows-${arch}.${ext}
